<div class="chatbot-wrapper" [class.chat-open]="isOpen()">
  
  <!-- پنجره پیام‌ها -->
  @if (isOpen()) {
    <div class="chat-window">
      <!-- هدر چت‌بات -->
      <div class="chat-header">
        <div class="header-info">
          <div class="bot-avatar">
            <mat-icon>smart_toy</mat-icon>
          </div>
          <div>
            <h4>دستیار هوشمند مهندسی</h4>
            <span class="status-indicator">پاسخگویی آنلاین</span>
          </div>
        </div>
        <button mat-icon-button class="close-btn" (click)="toggleChat()">
          <mat-icon>close</mat-icon>
        </button>
      </div>

      <!-- بدنه پیام‌ها -->
      <div class="chat-body">
        <div class="messages-container">
          @for (msg of messages(); track $index) {
            <div class="message-row" [class.user-row]="msg.sender === 'user'" [class.bot-row]="msg.sender === 'bot'">
              <div class="bubble">
                <p>{{ msg.text }}</p>
                <span class="msg-time">{{ msg.time }}</span>
              </div>
            </div>
          }

          @if (isTyping()) {
            <div class="typing-indicator">
              <span></span><span></span><span></span>
            </div>
          }
        </div>

        <!-- پیشنهادهای سریع -->
        <div class="quick-prompts">
          @for (suggestion of quickSuggestions; track suggestion) {
            <button type="button" class="prompt-chip" (click)="sendMessage(suggestion)">
              {{ suggestion }}
            </button>
          }
        </div>
      </div>

      <!-- فیلد ارسال پیام -->
      <div class="chat-footer">
        <form (ngSubmit)="sendMessage()" class="input-form">
          <input 
            type="text" 
            [(ngModel)]="userInput" 
            name="chatInput" 
            placeholder="سوال یا پیام خود را بنویسید..." 
            autocomplete="off"
          />
          <button type="submit" class="send-btn" [disabled]="!userInput().trim()">
            <mat-icon>send</mat-icon>
          </button>
        </form>
      </div>
    </div>
  }

  <!-- دکمه شناور باز/بسته کردن -->
  <button class="chat-trigger-btn" (click)="toggleChat()" aria-label="پشتیبانی آنلاین">
    @if (!isOpen()) {
      <mat-icon>chat</mat-icon>
      <span class="btn-tooltip">مشاوره هوشمند</span>
    } @else {
      <mat-icon>close</mat-icon>
    }
  </button>
</div>
